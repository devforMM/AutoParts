<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Stores</title>
</head>
<body>
    
    <h2>Your Stores</h2>
    <table>
        <thead>
            <tr>
                <th>Store Name</th>
                <th>Brand Group</th>
                <th>Store Adress</th>
                <th>Phone Number</th>
                <th>More</th>
            </tr>
        </thead>
        <tbody>
           {% for store in stores %}
           <tr>
            <td>{{store.name}}</td>
            <td>{{store.brand_group}}</td>
            <td>{{store.adress}}</td>
            <td>{{store.phone_number}}</td>
            <td><a href="/seller/store_details?store_id={{store.id}}">Store Details</a></td>
           </tr>
           {% endfor %}
        </tbody>
    </table>

    <p>Want to Create New Store? <a href="/seller/add_store">Create Store</a></p>


</body>
</html>
