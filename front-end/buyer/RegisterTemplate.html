<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/styles/buyer_styles.css">
    <title>Register</title>
</head>
<body class="auth">

    <main class="card auth-card">
        <h1>Create your account</h1>
        <p class="auth-sub">Register to find parts in our partner stores.</p>

        <form action="/buyer/register" method="post">
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email">
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password">
            </div>

            <div class="two-cols">
                <div class="field">
                    <label for="first_name">First name</label>
                    <input type="text" id="first_name" name="first_name">
                </div>
                <div class="field">
                    <label for="last_name">Last name</label>
                    <input type="text" id="last_name" name="last_name">
                </div>
            </div>

            <div class="field">
                <label for="adress">Address</label>
                <input type="text" id="adress" name="adress">
            </div>
            <div class="field">
                <label for="phone_number">Phone number</label>
                <input type="text" id="phone_number" name="phone_number">
            </div>

            <button type="submit" class="btn btn-primary">Register</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="/buyer/login">Login</a></p>
    </main>

</body>
</html>
